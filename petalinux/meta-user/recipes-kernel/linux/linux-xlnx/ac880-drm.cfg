# Xilinx PL display DRM/KMS pipeline (AXI VDMA MM2S + VTC bridge).
CONFIG_DRM_XLNX=y
CONFIG_DRM_XLNX_BRIDGE=y
CONFIG_DRM_XLNX_BRIDGE_VTC=y
CONFIG_DRM_XLNX_PL_DISP=y

# Expose the existing Xilinx DRM/KMS framebuffer helper as /dev/fb0.
# The linux-xlnx driver already implements xlnx_fb.c; enabling this
# compatibility layer avoids a second driver competing for the same VDMA.
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FB_CORE=y
CONFIG_FB_DEVICE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FB_SYS_FILLRECT=y
CONFIG_FB_SYS_COPYAREA=y
CONFIG_FB_SYS_IMAGEBLIT=y

# The generic DPI panel supplies the fixed 800x480 mode to DRM userspace.
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_COMMON_CLK_DGLNT_DYNCLK=y
